$kind: http-request
name: Unknown Route - 404
method: GET
url: '{{baseUrl}}/api/auth/doesnotexist'
order: 11000
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test("Status is 404", function () {
        pm.response.to.have.status(404);
      });

      pm.test("Response error contains 'not found'", function () {
        const json = pm.response.json();
        pm.expect(json.error).to.include("not found");
      });
