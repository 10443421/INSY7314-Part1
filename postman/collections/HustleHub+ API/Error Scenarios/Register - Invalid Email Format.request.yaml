$kind: http-request
name: Register - Invalid Email Format
method: POST
url: '{{baseUrl}}/api/auth/register'
order: 3000
headers:
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {
      "name": "Bad Email",
      "email": "not-an-email",
      "password": "SecurePass123",
      "role": "Client"
    }
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test("Status is 400", function () {
        pm.response.to.have.status(400);
      });

      pm.test("Response error contains 'email'", function () {
        const json = pm.response.json();
        pm.expect(json.error).to.include("email");
      });
