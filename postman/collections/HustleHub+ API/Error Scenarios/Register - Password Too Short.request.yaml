$kind: http-request
name: Register - Password Too Short
method: POST
url: '{{baseUrl}}/api/auth/register'
order: 4000
headers:
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {
      "name": "Short Pass",
      "email": "shortpass@example.com",
      "password": "abc",
      "role": "Client"
    }
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test("Status is 400", function () {
        pm.response.to.have.status(400);
      });

      pm.test("Response error contains 'Password'", function () {
        const json = pm.response.json();
        pm.expect(json.error).to.include("Password");
      });
