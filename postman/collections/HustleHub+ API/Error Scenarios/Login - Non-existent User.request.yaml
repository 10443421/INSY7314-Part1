$kind: http-request
name: Login - Non-existent User
method: POST
url: '{{baseUrl}}/api/auth/login'
order: 7000
headers:
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {
      "email": "ghost@example.com",
      "password": "SomePass123"
    }
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test("Status is 401", function () {
        pm.response.to.have.status(401);
      });

      pm.test("Response error contains 'Invalid'", function () {
        const json = pm.response.json();
        pm.expect(json.error).to.include("Invalid");
      });
