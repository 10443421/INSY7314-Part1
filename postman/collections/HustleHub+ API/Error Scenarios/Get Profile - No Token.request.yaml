$kind: http-request
name: Get Profile - No Token
method: GET
url: '{{baseUrl}}/api/auth/profile'
order: 9000
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test("Status is 401", function () {
        pm.response.to.have.status(401);
      });

      pm.test("Response error contains 'token' or 'Access'", function () {
        const json = pm.response.json();
        pm.expect(json.error).to.satisfy(function (msg) {
          return msg.includes("token") || msg.includes("Access");
        });
      });
